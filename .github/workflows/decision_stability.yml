name: PAH-PQC Decision Stability Analysis

on:
  workflow_dispatch:

jobs:
  decision-stability:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ARM64
        run: |
          uname -m

      - name: Setup Python
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pandas numpy

      - name: Run decision stability analysis
        run: |
          source venv/bin/activate
          python3 decision_stability_analysis.py

      - name: Show consensus results
        run: |
          cat decision_consensus_summary.csv

      - name: Upload decision results
        uses: actions/upload-artifact@v4
        with:
          name: pah-pqc-decision-stability-results
          path: |
            decision_stability_results.csv
            decision_consensus_summary.csv
