name: PAH-PQC Security Validation

on:
  workflow_dispatch:

jobs:
  security-validation:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ARM64
        run: |
          uname -m
          lscpu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            libssl-dev \
            python3 \
            python3-pip \
            python3-venv

      - name: Build liboqs
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build
          cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Setup Python
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install cryptography pandas
          pip install git+https://github.com/open-quantum-safe/liboqs-python.git

      - name: Build Ascon shared library
        run: |
          git clone --depth 1 https://github.com/ascon/ascon-c.git
          cd ascon-c

          gcc -O3 -fPIC -shared \
            -Icrypto_aead/asconaead128/ref \
            -Itests \
            crypto_aead/asconaead128/ref/*.c \
            -o ../libascon.so

          cd ..
          ls -lh libascon.so

      - name: Run security validation suite
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          ASCON_LIB: ./libascon.so
        run: |
          source venv/bin/activate
          python3 security_validation.py

      - name: Show security results
        run: |
          cat security_validation_results.csv

      - name: Upload security-validation results
        uses: actions/upload-artifact@v4
        with:
          name: pah-pqc-security-validation-results
          path: security_validation_results.csv
