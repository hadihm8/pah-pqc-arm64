name: PAH-PQC Statistical Analysis

on:
  workflow_dispatch:

jobs:
  statistics:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m

      - name: Setup Python
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pandas numpy scipy statsmodels

      - name: Run statistical analysis
        run: |
          source venv/bin/activate
          python3 statistical_analysis.py

      - name: Validate statistical outputs
        run: |
          wc -l friedman_results.csv
          wc -l wilcoxon_holm_results.csv

          echo "Expected Friedman lines including header: 29"
          echo "Expected Wilcoxon-Holm lines including header: 281"

      - name: Upload statistical results
        uses: actions/upload-artifact@v4
        with:
          name: pah-pqc-statistical-results
          path: |
            friedman_results.csv
            wilcoxon_holm_results.csv
