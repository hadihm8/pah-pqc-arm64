name: PAH-PQC ARM64 Pilot Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ARM64
        run: |
          uname -m
          lscpu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            libssl-dev \
            python3 \
            python3-pip \
            python3-venv

      - name: Build liboqs
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build
          cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Setup Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install cryptography numpy scipy pandas
          pip install git+https://github.com/open-quantum-safe/liboqs-python.git

      - name: Build Ascon shared library
        run: |
          git clone --depth 1 https://github.com/ascon/ascon-c.git
          cd ascon-c

          gcc -O3 -fPIC -shared \
            -Icrypto_aead/asconaead128/ref \
            -Itests \
            crypto_aead/asconaead128/ref/*.c \
            -o ../libascon.so

          cd ..
          ls -lh libascon.so
          echo "Ascon shared library: OK"
      - name: Run PAH-PQC pilot benchmark
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          ASCON_LIB: ./libascon.so
        run: |
          source venv/bin/activate
          python3 benchmark_pah_pqc.py

      - name: Show pilot summary
        run: |
          echo "=============================="
          echo "RAW RESULTS"
          echo "=============================="
          cat pilot_results_raw.csv

          echo "=============================="
          echo "SUMMARY RESULTS"
          echo "=============================="
          cat pilot_results_summary.csv

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: pah-pqc-arm64-pilot-results
          path: |
            pilot_results_raw.csv
            pilot_results_summary.csv
