name: PAH-PQC Policy Test

on:
  workflow_dispatch:

jobs:
  policy-test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m

      - name: Run PAH-PQC policy engine
        run: |
          python3 pah_pqc.py
