name: ARM64 Environment Check

on:
  workflow_dispatch:

jobs:
  arm64-check:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system architecture
        run: |
          uname -a
          uname -m
          lscpu

      - name: Show Python version
        run: |
          python3 --version

      - name: Show OS information
        run: |
          cat /etc/os-release
