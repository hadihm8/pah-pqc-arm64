name: ARM64 Crypto Core Check

on:
  workflow_dispatch:

jobs:
  crypto-core:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check ARM64
        run: |
          uname -m

      - name: Setup Python
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install cryptography

      - name: Verify X25519 AES-GCM HKDF
        run: |
      - name: Install liboqs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential libssl-dev

      - name: Build and verify ML-KEM-768
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_INSTALL_PREFIX=/usr/local -DOQS_BUILD_ONLY_LIB=ON ..
          ninja
          sudo ninja install
          sudo ldconfig
          grep -R "ML-KEM-768" /usr/local/include/oqs
          echo "ML-KEM-768: OK"
              source venv/bin/activate
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes

          private_key = X25519PrivateKey.generate()
          public_key = private_key.public_key()

          aes_key = AESGCM.generate_key(bit_length=256)

          hkdf = HKDF(
              algorithm=hashes.SHA256(),
              length=32,
              salt=None,
              info=b"PAH-PQC"
          )

          derived_key = hkdf.derive(b"shared-secret")

          print("X25519: OK")
          print("AES-256-GCM: OK")
          print("HKDF-SHA256: OK")
          print("Derived key length:", len(derived_key))
          PY
